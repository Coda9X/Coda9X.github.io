<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I write code _</title>
    <style>
        :root {
            --bg-deep: #080c16;
            --bg-charcoal: #101522;
            --bg-navy: #0b1120;
            --bone-white: #f5f2eb;
            --bone-muted: #f5f2ebad;
            --emerald-glow: #10b981;
            --glass-border: rgba(245, 242, 235, 0.22);
            --glass-highlight: rgba(255, 255, 255, 0.4);
            --glass-surface: rgba(16, 21, 34, 0.58);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }

        @media (pointer: fine) {
            * {
                cursor: none !important;
            }
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 48%, var(--bg-charcoal) 0%, var(--bg-navy) 52%, var(--bg-deep) 100%);
            color: var(--bone-white);
            font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        #weave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #main-stage {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
        }

        .center-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            max-width: 740px;
            width: 100%;
            pointer-events: none;
            position: relative;
        }

        .center-card::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(380px, 92vw, 780px);
            height: 290px;
            background: radial-gradient(ellipse at center, rgba(8, 12, 22, 0.96) 0%, rgba(8, 12, 22, 0.84) 44%, rgba(8, 12, 22, 0.38) 70%, rgba(8, 12, 22, 0) 88%);
            pointer-events: none;
            z-index: -1;
            filter: blur(22px);
        }

        .status-badge {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.14) 0%, rgba(16, 21, 34, 0.68) 100%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 1px var(--glass-highlight);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--bone-white);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: var(--emerald-glow);
            box-shadow: 0 0 10px var(--emerald-glow), 0 0 20px var(--emerald-glow);
            animation: pulse-dot 2.4s infinite ease-in-out;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 8px var(--emerald-glow), 0 0 18px rgba(16, 185, 129, 0.75);
            }

            50% {
                transform: scale(1.3);
                opacity: 0.75;
                box-shadow: 0 0 14px var(--emerald-glow), 0 0 26px rgba(16, 185, 129, 1);
            }
        }

        .hero-title {
            pointer-events: auto;
            font-size: clamp(2.2rem, 5.8vw, 4.4rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--bone-white);
            text-shadow: 0 0 48px rgba(0, 0, 0, 1), 0 0 28px rgba(0, 0, 0, 0.98), 0 4px 18px rgba(0, 0, 0, 0.95);
            line-height: 1.15;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .blinking-cursor {
            display: inline-block;
            margin-left: 4px;
            color: var(--bone-white);
            animation: blink-underscore 1.05s steps(2, start) infinite;
        }

        @keyframes blink-underscore {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .btn-interaction-zone {
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            position: relative;
        }

        .liquid-btn {
            pointer-events: auto;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 26px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--bone-white);
            text-decoration: none;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.16) 0%, rgba(245, 242, 235, 0.04) 50%, rgba(16, 21, 34, 0.76) 100%);
            border: 1px solid rgba(245, 242, 235, 0.25);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.65), inset 0 1.5px 2px rgba(255, 255, 255, 0.42), inset 0 -2px 6px rgba(10, 15, 27, 0.85);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            overflow: hidden;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            will-change: transform;
        }

        .liquid-btn::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -40%;
            width: 180%;
            height: 220%;
            background: radial-gradient(circle at var(--glare-x, 30%) var(--glare-y, 30%), rgba(255, 255, 255, 0.35) 0%, rgba(245, 242, 235, 0.08) 28%, transparent 62%);
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .liquid-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            pointer-events: none;
        }

        .liquid-btn:hover {
            border-color: rgba(245, 242, 235, 0.65);
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.75), 0 0 24px rgba(0, 245, 255, 0.25), inset 0 2px 3px rgba(255, 255, 255, 0.65), inset 0 -2px 8px rgba(0, 245, 255, 0.24);
        }

        .liquid-btn svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
        }

        #cursor-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            display: block;
        }

        #cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            margin-left: -3px;
            margin-top: -3px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            pointer-events: none;
            will-change: transform;
            transition: transform 0.05s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        #cursor-droplet {
            position: fixed;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            margin-left: -22px;
            margin-top: -22px;
            border: 1.4px solid rgba(245, 242, 235, 0.65);
            background: transparent;
            border-radius: 50% 60% 60% 50% / 50% 50% 70% 70%;
            pointer-events: none;
            will-change: transform;
        }

        #context-menu {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 235px;
            padding: 8px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(20, 26, 40, 0.88) 0%, rgba(10, 14, 25, 0.94) 100%);
            border: 1px solid rgba(245, 242, 235, 0.22);
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.72), inset 0 1px 1.5px rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 1000;
            opacity: 0;
            transform: scale(0.92) translateY(-6px);
            transform-origin: top left;
            pointer-events: none;
            transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #context-menu.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .ctx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--bone-white);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            text-align: left;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .ctx-item:hover {
            background: rgba(245, 242, 235, 0.12);
            transform: translateX(2px);
        }

        .ctx-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctx-item svg {
            width: 16px;
            height: 16px;
            stroke: var(--bone-white);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ctx-shortcut {
            font-size: 0.7rem;
            color: var(--bone-muted);
        }

        .ctx-divider {
            height: 1px;
            margin: 6px 8px;
            background: rgba(245, 242, 235, 0.12);
        }

        #toast-banner {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(16, 21, 34, 0.92);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), inset 0 1px 1px var(--glass-highlight);
            backdrop-filter: blur(16px);
            color: var(--bone-white);
            font-size: 0.8rem;
            z-index: 1200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #toast-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(8, 12, 22, 0.82);
            backdrop-filter: blur(12px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .liquid-modal {
            max-width: 540px;
            width: 100%;
            padding: 32px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.14) 0%, rgba(16, 21, 34, 0.92) 100%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 28px 64px rgba(0, 0, 0, 0.78), inset 0 1.5px 2px var(--glass-highlight);
            backdrop-filter: blur(20px) saturate(180%);
            color: var(--bone-white);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-backdrop.open .liquid-modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-body {
            font-size: 0.85rem;
            line-height: 1.65;
            color: var(--bone-muted);
            margin-bottom: 24px;
        }

        .not-found-card {
            pointer-events: auto;
            max-width: 480px;
            width: 100%;
            padding: 42px 32px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.15) 0%, rgba(16, 21, 34, 0.82) 100%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 28px 68px rgba(0, 0, 0, 0.75), inset 0 2px 3px var(--glass-highlight);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .not-found-code {
            font-size: clamp(3.2rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--bone-white);
            text-shadow: 0 0 32px rgba(0, 245, 255, 0.45);
        }

        .not-found-desc {
            font-size: 0.92rem;
            color: var(--bone-muted);
            line-height: 1.6;
        }

        @media (pointer: coarse),
        (max-width: 600px) {
            .status-badge {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.95);
            }

            .liquid-btn {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.95);
                padding: 11px 18px;
                font-size: 0.82rem;
                width: auto;
                min-width: 120px;
            }

            .modal-backdrop {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(8, 12, 22, 0.95);
            }

            .liquid-modal {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.95);
            }

            .not-found-card {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.95);
            }

            #context-menu {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.95);
            }

            .btn-interaction-zone {
                gap: 12px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <canvas id="weave-canvas"></canvas>
    <main id="main-stage"></main>
    <div id="context-menu" role="menu" aria-hidden="true"></div>
    <div id="toast-banner"></div>
    <div id="cursor-root">
        <div id="cursor-droplet"></div>
        <div id="cursor-dot"></div>
    </div>
    <script>
        const CONFIG = {
            text: {
                status: "Online",
                heroPrefix: "I write code ",
                cursorChar: "_",
                shareSuccess: "Portfolio coordinate link copied to clipboard",
                contactCopied: "Direct contact address copied to clipboard: itscoda9x@gmail.com",
            },
            colors: {
                backgroundDeep: "#080c16",
                backgroundCharcoal: "#101522",
                backgroundNavy: "#0b1120",
                boneWhite: "#f5f2eb",

                coreWhite: "#ffffff",
                strings: [
                    { base: "#00f5ff", glow: "rgba(0, 245, 255, 0.45)" },
                    { base: "#ffe600", glow: "rgba(255, 230, 0, 0.48)" },
                    { base: "#ff1e50", glow: "rgba(255, 30, 80, 0.48)" },
                    { base: "#00ffcc", glow: "rgba(0, 255, 204, 0.45)" },
                    { base: "#2979ff", glow: "rgba(41, 121, 255, 0.48)" },
                    { base: "#ff9e00", glow: "rgba(255, 158, 0, 0.45)" },
                    { base: "#b026ff", glow: "rgba(176, 38, 255, 0.45)" },
                    { base: "#ffea00", glow: "rgba(255, 234, 0, 0.48)" },
                    { base: "#39ff14", glow: "rgba(57, 255, 20, 0.45)" },
                    { base: "#ff1493", glow: "rgba(255, 20, 147, 0.45)" },
                    { base: "#00bfff", glow: "rgba(0, 191, 255, 0.45)" }
                ],
                sparks: ["#ffffff", "#00f5ff", "#ffe600", "#ff1e50", "#39ff14", "#2979ff", "#b026ff"]
            },
            links: [
                {
                    id: "github",
                    label: "GitHub",
                    url: "https://github.com",
                    shortcut: "GH",
                    icon: '<svg viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>'
                },
                {
                    id: "contact",
                    label: "Contact",
                    url: "mailto:itscoda9x@gmail.com",
                    shortcut: "EM",
                    isContact: true,
                    icon: '<svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>'
                },
            ],
            socialMenu: [
                {
                    id: "github",
                    label: "GitHub Profile",
                    url: "https://github.com/Coda9X",
                    shortcut: "GH",
                    icon: '<svg viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>'
                }
            ],
            weave: {
                stringCountHigh: 18,
                stringCountLow: 18,
                segmentCountHigh: 24,
                segmentCountLow: 24,
                destExtraMargin: 700,
                glowWidth: 4.0,
                coreWidth: 1.2,
                glowAlpha: 0.48,
                coreAlpha: 0.5,
                clockFactor: 0.01,
                waveSpeed: 0.04,
                braidSpeed: 0.02,
                riverSpeed: 0.02,
                destSpeed: 0.0002,
                centerSpeed: 0.0005,
                destAngleBase: 2.45,
                destAngleWander: 0.12,
                harmonicArchAmplitude: 200,
                braidRadiusOuter: 90,
                braidRadiusInner: 50,
                braidFreqOuter: 40,
                braidFreqInner: 40,
                lifespanMinFrames: 1000,
                lifespanMaxFrames: 1000,
                fadeFrames: 120,
                sparkSpawnProbability: 100,
                maxSparksHigh: 36,
                maxSparksLow: 14,
                sparkLifeMin: 38,
                sparkLifeMax: 76
            },
            cursor: {
                dropletLerp: 0.18,
                stretchFactor: 0.032,
                maxStretch: 0.5,
                rotationSpeed: 0.018,
                magneticDistance: 110,
                magneticForce: 0.24
            },
            performance: {
                fpsThreshold: 50,
                lowFpsDurationThresholdMs: 1500,
                checkIntervalMs: 250
            }
        };
        (function bootstrapPortfolio() {
            const canvas = document.getElementById("weave-canvas");
            const ctx = canvas.getContext("2d", { alpha: true });
            const mainStage = document.getElementById("main-stage");
            const contextMenu = document.getElementById("context-menu");
            const toastBanner = document.getElementById("toast-banner");
            const cursorRoot = document.getElementById("cursor-root");
            const cursorDot = document.getElementById("cursor-dot");
            const cursorDroplet = document.getElementById("cursor-droplet");
            const isTouchDevice = window.matchMedia("(pointer: coarse)").matches || ("ontouchstart" in window);
            if (isTouchDevice && cursorRoot) {
                cursorRoot.style.display = "none";
            }
            let width = window.innerWidth;
            let height = window.innerHeight;
            let dpr = isTouchDevice ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
            let time = 0;
            let is404Mode = false;
            let isAnimationPaused = false;
            let animFrameId = null;
            let isLowQualityMode = false;
            let currentSegmentCount = CONFIG.weave.segmentCountHigh;
            let maxSparksCount = CONFIG.weave.maxSparksHigh;
            let lowFpsTimeAccumulator = 0;
            let frameCount = 0;
            let lastFpsCheckTime = performance.now();
            const pointer = {
                x: width * 0.5,
                y: height * 0.5,
                smoothX: width * 0.5,
                smoothY: height * 0.5,
                dropX: width * 0.5,
                dropY: height * 0.5,
                angle: 0,
                dropScale: 1.0,
                hasMoved: false,
                isDown: false
            };
            const convergencePoint = {
                x: width * 0.50,
                y: height * 0.48,
                seedX: Math.random() * 1000,
                seedY: Math.random() * 1000
            };
            const destinationPoint = {
                x: -450,
                y: height + 450,
                t: Math.random() * 500
            };
            const spineGuides = {
                b0: { x: width * 0.82, y: -240 },
                b1: { x: width * 0.68, y: height * 0.20 },
                b2: { x: width * 0.30, y: height * 0.74 },
                b3: { x: -450, y: height + 450 }
            };
            const segLookup = [];
            const frameSpine = [];
            function initSegLookup(count) {
                segLookup.length = 0;
                frameSpine.length = 0;
                for (let i = 0; i < count; i++) {
                    const s = i / (count - 1);
                    const u = 1 - s;
                    const u2 = u * u;
                    const u3 = u2 * u;
                    const s2 = s * s;
                    const s3 = s2 * s;
                    const rawFree = Math.max(0, Math.min(1, 1 - (s / 0.44)));
                    const wFree = rawFree * rawFree * (3 - 2 * rawFree);
                    const rawBraid = Math.max(0, Math.min(1, (s - 0.30) / 0.18));
                    const wBraid = rawBraid * rawBraid * (3 - 2 * rawBraid);
                    const archFactor = Math.sin(s * Math.PI);
                    segLookup.push({
                        s: s,
                        u: u,
                        u3: u3,

                        lowFpsTimeAccumulator = Math.max(0, lowFpsTimeAccumulator - elapsed * 0.5);
                    }
                }
            }
            let lastFrameTime = performance.now();
            function animate(now) {
                if (isAnimationPaused) return;
                const deltaMs = now - lastFrameTime;
                lastFrameTime = now;
                monitorPerformance(now);
                const dt = Math.min(deltaMs, 32);
                time += dt * CONFIG.weave.clockFactor;
                ctx.clearRect(0, 0, width, height);
                updateFieldCoordinates(dt);
                updateAndRenderStrings(dt);
                updateAndRenderSparks();
                updateCustomCursor();
                animFrameId = requestAnimationFrame(animate);
            }
            initSegLookup(currentSegmentCount);
            resizeCanvas();
            window.addEventListener("resize", function () {
                resizeCanvas();
                initSegLookup(currentSegmentCount);
            });
            buildContextMenu();
            renderPortfolioUI();
            initStrands();
            bindPointerEvents();
            animFrameId = requestAnimationFrame(animate);
        })();
    </script>
</body>

</html>
