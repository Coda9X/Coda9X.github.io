<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I write code _</title>
    <style>
        :root {
            --bg-deep: #080c16;
            --bg-charcoal: #101522;
            --bg-navy: #0b1120;
            --bone-white: #f5f2eb;
            --bone-muted: rgba(245, 242, 235, 0.68);
            --emerald-glow: #10b981;
            --glass-border: rgba(245, 242, 235, 0.2);
            --glass-highlight: rgba(255, 255, 255, 0.38);
            --glass-surface: rgba(16, 21, 34, 0.58);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-drag: none;
        }

        @media (pointer: fine) {
            * {
                cursor: none !important;
            }
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, var(--bg-charcoal) 0%, var(--bg-navy) 55%, var(--bg-deep) 100%);
            color: var(--bone-white);
            font-family: "JetBrains Mono", "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        #weave-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        #main-stage {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            pointer-events: none;
        }

        .center-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            max-width: 720px;
            width: 100%;
            pointer-events: none;
            position: relative;
        }

        .center-card::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(340px, 85vw, 680px);
            height: 240px;
            background: radial-gradient(ellipse at center, rgba(8, 12, 22, 0.94) 0%, rgba(8, 12, 22, 0.72) 48%, rgba(8, 12, 22, 0) 80%);
            pointer-events: none;
            z-index: -1;
            filter: blur(18px);
        }

        .status-badge {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 7px 18px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.12) 0%, rgba(16, 21, 34, 0.65) 100%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 1px var(--glass-highlight);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--bone-white);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: var(--emerald-glow);
            box-shadow: 0 0 10px var(--emerald-glow), 0 0 20px var(--emerald-glow);
            animation: pulse-dot 2.4s infinite ease-in-out;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
                box-shadow: 0 0 8px var(--emerald-glow), 0 0 18px rgba(16, 185, 129, 0.75);
            }

            50% {
                transform: scale(1.3);
                opacity: 0.75;
                box-shadow: 0 0 14px var(--emerald-glow), 0 0 26px rgba(16, 185, 129, 1);
            }
        }

        .hero-title {
            pointer-events: auto;
            font-size: clamp(2.1rem, 5.5vw, 4.25rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            color: var(--bone-white);
            text-shadow:
                0 0 44px rgba(0, 0, 0, 0.98),
                0 0 28px rgba(0, 0, 0, 0.95),
                0 4px 18px rgba(0, 0, 0, 0.9);
            line-height: 1.15;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .blinking-cursor {
            display: inline-block;
            margin-left: 4px;
            color: var(--bone-white);
            animation: blink-underscore 1.05s steps(2, start) infinite;
        }

        @keyframes blink-underscore {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }
        }

        .btn-interaction-zone {
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            position: relative;
        }

        .liquid-btn {
            pointer-events: auto;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 24px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--bone-white);
            text-decoration: none;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.16) 0%, rgba(245, 242, 235, 0.04) 50%, rgba(16, 21, 34, 0.72) 100%);
            border: 1px solid rgba(245, 242, 235, 0.25);
            box-shadow:
                0 14px 34px rgba(0, 0, 0, 0.62),
                inset 0 1.5px 2px rgba(255, 255, 255, 0.42),
                inset 0 -2px 6px rgba(11, 17, 32, 0.8);
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            overflow: hidden;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            will-change: transform;
        }

        .liquid-btn::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -40%;
            width: 180%;
            height: 220%;
            background: radial-gradient(circle at var(--glare-x, 30%) var(--glare-y, 30%), rgba(255, 255, 255, 0.35) 0%, rgba(245, 242, 235, 0.08) 28%, transparent 62%);
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .liquid-btn::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 17px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            pointer-events: none;
        }

        .liquid-btn:hover {
            border-color: rgba(245, 242, 235, 0.6);
            box-shadow:
                0 18px 42px rgba(0, 0, 0, 0.7),
                0 0 24px rgba(0, 245, 255, 0.25),
                inset 0 2px 3px rgba(255, 255, 255, 0.65),
                inset 0 -2px 8px rgba(0, 245, 255, 0.24);
        }

        .liquid-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        #cursor-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            display: block;
        }

        #cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.95);
            pointer-events: none;
            will-change: transform;
        }

        #cursor-droplet {
            position: fixed;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1.4px solid rgba(245, 242, 235, 0.9);
            background: radial-gradient(circle at 32% 28%, rgba(245, 242, 235, 0.42) 0%, rgba(245, 242, 235, 0.12) 45%, rgba(245, 242, 235, 0.03) 75%, transparent 100%);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.55), 0 0 18px rgba(245, 242, 235, 0.25);
            pointer-events: none;
            will-change: transform;
        }

        #context-menu {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 230px;
            padding: 8px;
            border-radius: 14px;
            background: linear-gradient(145deg, rgba(22, 28, 44, 0.88) 0%, rgba(10, 14, 25, 0.94) 100%);
            border: 1px solid rgba(245, 242, 235, 0.22);
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.7), inset 0 1px 1.5px rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 1000;
            opacity: 0;
            transform: scale(0.92) translateY(-6px);
            transform-origin: top left;
            pointer-events: none;
            transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #context-menu.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .ctx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--bone-white);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 500;
            text-align: left;
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .ctx-item:hover {
            background: rgba(245, 242, 235, 0.12);
            transform: translateX(2px);
        }

        .ctx-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctx-item svg {
            width: 16px;
            height: 16px;
            stroke: var(--bone-white);
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ctx-shortcut {
            font-size: 0.7rem;
            color: var(--bone-muted);
        }

        .ctx-divider {
            height: 1px;
            margin: 6px 8px;
            background: rgba(245, 242, 235, 0.12);
        }

        #toast-banner {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(24px);
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(16, 21, 34, 0.9);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 1px 1px var(--glass-highlight);
            backdrop-filter: blur(16px);
            color: var(--bone-white);
            font-size: 0.8rem;
            z-index: 1200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        #toast-banner.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(6, 9, 16, 0.78);
            backdrop-filter: blur(12px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .liquid-modal {
            max-width: 540px;
            width: 100%;
            padding: 32px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.14) 0%, rgba(16, 21, 34, 0.9) 100%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 28px 64px rgba(0, 0, 0, 0.75), inset 0 1.5px 2px var(--glass-highlight);
            backdrop-filter: blur(20px) saturate(180%);
            color: var(--bone-white);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .modal-backdrop.open .liquid-modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .modal-body {
            font-size: 0.85rem;
            line-height: 1.65;
            color: var(--bone-muted);
            margin-bottom: 24px;
        }

        .resume-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }

        .resume-stat {
            padding: 12px;
            border-radius: 12px;
            background: rgba(245, 242, 235, 0.05);
            border: 1px solid rgba(245, 242, 235, 0.12);
        }

        .resume-stat strong {
            display: block;
            color: var(--bone-white);
            font-size: 0.92rem;
            margin-bottom: 4px;
        }

        .not-found-card {
            pointer-events: auto;
            max-width: 480px;
            width: 100%;
            padding: 42px 32px;
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(245, 242, 235, 0.15) 0%, rgba(16, 21, 34, 0.8) 100%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 28px 68px rgba(0, 0, 0, 0.7), inset 0 2px 3px var(--glass-highlight);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .not-found-code {
            font-size: clamp(3.2rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--bone-white);
            text-shadow: 0 0 32px rgba(0, 245, 255, 0.45);
        }

        .not-found-desc {
            font-size: 0.92rem;
            color: var(--bone-muted);
            line-height: 1.6;
        }

        @media (pointer: coarse),
        (max-width: 600px) {
            .status-badge {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.88);
            }

            .liquid-btn {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.9);
                padding: 11px 18px;
                font-size: 0.82rem;
                width: calc(50% - 8px);
                min-width: 135px;
            }

            .modal-backdrop {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(6, 9, 16, 0.92);
            }

            .liquid-modal {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.96);
            }

            .not-found-card {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(16, 21, 34, 0.96);
            }

            #context-menu {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: rgba(14, 18, 30, 0.96);
            }

            .btn-interaction-zone {
                gap: 12px;
                padding: 8px;
            }

            .resume-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <canvas id="weave-canvas"></canvas>

    <main id="main-stage"></main>

    <div id="context-menu" role="menu" aria-hidden="true"></div>
    <div id="toast-banner"></div>

    <div id="resume-modal" class="modal-backdrop">
        <div class="liquid-modal">
            <div class="modal-header">
                <div class="modal-title" id="resume-modal-title"></div>
                <button type="button" class="liquid-btn" id="close-resume-btn" style="padding: 6px 14px; border-radius: 12px;">Close</button>
            </div>
            <div class="modal-body" id="resume-modal-body"></div>
        </div>
    </div>

    <div id="cursor-root">
        <div id="cursor-droplet"></div>
        <div id="cursor-dot"></div>
    </div>

    <script>
        const CONFIG = {

                ]
            },

                    { base: "#00f5ff", glow: "rgba(0, 245, 255, 0.42)" },

                ],

            },
            links: [
                {

                },
                {

                {

                waveBaseSpeed: 0.00012,

            security: {
                enableResizeAnomalyTrap: true,

                crashPayload: "<div style='display:flex;height:100vh;width:100vw;align-items:center;justify-content:center;background:#080c16;color:#ff007f;font-family:monospace;font-size:1.1rem;letter-spacing:0.08em;'>SESSION TERMINATED - SECURITY VIOLATION DETECTED</div>",
                allowedRootPaths: ["/", "/index.html", "/srcdoc", "blank", ""]

        };

        (function bootstrapPortfolio() {
            const canvas = document.getElementById("weave-canvas");
            const ctx = canvas.getContext("2d", { alpha: true });
            const mainStage = document.getElementById("main-stage");
            const contextMenu = document.getElementById("context-menu");
            const toastBanner = document.getElementById("toast-banner");
            const resumeModal = document.getElementById("resume-modal");
            const closeResumeBtn = document.getElementById("close-resume-btn");
            const cursorRoot = document.getElementById("cursor-root");
            const cursorDot = document.getElementById("cursor-dot");
            const cursorDroplet = document.getElementById("cursor-droplet");

            const isTouchDevice = window.matchMedia("(pointer: coarse)").matches || ("ontouchstart" in window);
            if (isTouchDevice && cursorRoot) {
                cursorRoot.style.display = "none";
            }

            let width = window.innerWidth;
            let height = window.innerHeight;
            let dpr = Math.min(window.devicePixelRatio || 1, 2);
            let time = 0;
            let is404Mode = false;
            let systemTerminated = false;
            let isAnimationPaused = false;
            let animFrameId = null;

            const pointer = {
                x: width * 0.5,
                y: height * 0.5,
                dropX: width * 0.5,
                dropY: height * 0.5,
                vx: 0,

            };

            const convergencePoint = {
                x: width * 0.44,
                y: height * 0.48,
                seedX: Math.random() * 1000,
                seedY: Math.random() * 1000
            };

            const destinationPoint = {
                x: width * 1.5,
                y: height * 1.5,
                angle: Math.random() * Math.PI * 2
            };

            const strings = [];
            const sparks = [];
            let interactiveButtons = [];

            const spineCache = { x: 0, y: 0, nx: 0, ny: 0, tx: 0, ty: 0 };

            function triggerSecurityCrash() {
                if (systemTerminated) return;
                systemTerminated = true;
                if (animFrameId) cancelAnimationFrame(animFrameId);
                document.body.innerHTML = CONFIG.security.crashPayload;
            }

            function initSecurityGuards() {
                window.addEventListener("dragstart", function (e) {
                    e.preventDefault();
                    return false;
                }, { passive: false });

                window.addEventListener("selectstart", function (e) {
                    e.preventDefault();
                    return false;
                }, { passive: false });

                window.addEventListener("keydown", function (e) {
                    const key = e.key ? e.key.toUpperCase() : "";
                    if (
                        e.keyCode === 123 ||
                        (e.ctrlKey && e.shiftKey && (key === "I" || key === "J" || key === "C")) ||
                        (e.metaKey && e.altKey && (key === "I" || key === "J" || key === "C")) ||
                        (e.ctrlKey && key === "U")
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        triggerSecurityCrash();
                        return false;
                    }
                }, true);

                let baselineDiffW = Math.abs(window.outerWidth - window.innerWidth);
                let baselineDiffH = Math.abs(window.outerHeight - window.innerHeight);

                window.addEventListener("resize", function () {
                    if (!CONFIG.security.enableResizeAnomalyTrap) return;
                    if (window.outerWidth > 0 && window.outerHeight > 0) {
                        const currentDiffW = Math.abs(window.outerWidth - window.innerWidth);
                        const currentDiffH = Math.abs(window.outerHeight - window.innerHeight);
                        if (
                            currentDiffW - baselineDiffW > CONFIG.security.devtoolsThresholdPx ||
                            currentDiffH - baselineDiffH > CONFIG.security.devtoolsThresholdPx
                        ) {
                            triggerSecurityCrash();
                        }
                    }
                });
            }

            function showToast(msg) {
                toastBanner.textContent = msg;
                toastBanner.classList.add("show");
                clearTimeout(showToast._timer);
                showToast._timer = setTimeout(function () {
                    toastBanner.classList.remove("show");
                }, 2600);
            }

            function pauseRendering() {
                isAnimationPaused = true;
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
            }

            function resumeRendering() {
                if (!isAnimationPaused || systemTerminated) return;
                isAnimationPaused = false;
                lastFrameTime = performance.now();
                animFrameId = requestAnimationFrame(animate);
            }

            function openResumeModal() {
                const titleEl = document.getElementById("resume-modal-title");
                const bodyEl = document.getElementById("resume-modal-body");
                if (titleEl && bodyEl) {
                    titleEl.textContent = CONFIG.text.resumeTitle;
                    let cardsHtml = '<p style="margin-bottom:14px;">' + CONFIG.text.resumeSummary + '</p><div class="resume-grid">';
                    for (let i = 0; i < CONFIG.text.resumeHighlights.length; i++) {
                        const item = CONFIG.text.resumeHighlights[i];
                        cardsHtml += '<div class="resume-stat"><strong>' + item.title + '</strong><span>' + item.detail + '</span></div>';
                    }
                    cardsHtml += '</div>';
                    bodyEl.innerHTML = cardsHtml;
                }
                resumeModal.classList.add("open");
                pauseRendering();
            }

            function closeResumeModal() {
                resumeModal.classList.remove("open");
                resumeRendering();
            }

            if (closeResumeBtn) {
                closeResumeBtn.addEventListener("click", closeResumeModal);

            if (resumeModal) {

            function copyShareUrl() {
                const shareUrl = window.location.href;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(function () {
                        showToast(CONFIG.text.shareSuccess);
                    }).catch(function () {
                        fallbackCopy(shareUrl);
                    });
                } else {
                    fallbackCopy(shareUrl);
                }
            }

            function fallbackCopy(text) {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    showToast(CONFIG.text.shareSuccess);
                } catch (err) {
                    showToast(CONFIG.text.shareSuccess);
                }
                document.body.removeChild(ta);

            function checkRouteIsValid() {
                const rawPath = window.location.pathname || "/";
                if (window.location.hash === "#404") return false;
                for (let i = 0; i < CONFIG.security.allowedRootPaths.length; i++) {
                    const allowed = CONFIG.security.allowedRootPaths[i];
                    if (rawPath === allowed || rawPath.endsWith("/index.html") || rawPath.includes("ttl=63d")) {
                        return true;
                    }
                }
                return rawPath === "/";

            }

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function createStrandObject(colorIndex) {
                const m = CONFIG.weave.boundaryMargin;
                const edge = Math.floor(Math.random() * 4);
                let ox, oy;
                if (edge === 0) {
                    ox = -m - Math.random() * 140;
                    oy = -m + Math.random() * (height + m * 2);
                } else if (edge === 1) {
                    ox = width + m + Math.random() * 140;
                    oy = -m + Math.random() * (height + m * 2);
                } else if (edge === 2) {
                    ox = -m + Math.random() * (width + m * 2);
                    oy = -m - Math.random() * 140;
                } else {
                    ox = -m + Math.random() * (width + m * 2);
                    oy = height + m + Math.random() * 140;
                }

                const maxPts = CONFIG.weave.segmentCountHigh;
                const points = new Array(maxPts);
                for (let p = 0; p < maxPts; p++) {
                    points[p] = { x: ox, y: oy };
                }

                const maxLifespan = CONFIG.weave.lifespanMinFrames + Math.random() * (CONFIG.weave.lifespanMaxFrames - CONFIG.weave.lifespanMinFrames);
                const colorScheme = CONFIG.colors.strings[colorIndex % CONFIG.colors.strings.length];

                return {
                    color: colorScheme.base,
                    glowColor: colorScheme.glow,
                    originX: ox,
                    originY: oy,
                    originDriftSeedX: Math.random() * 1000,
                    originDriftSeedY: Math.random() * 1000,
                    freq1: 1.6 + Math.random() * 2.2,
                    freq2: 3.2 + Math.random() * 2.5,
                    amp1: 24 + Math.random() * 38,
                    amp2: 10 + Math.random() * 20,
                    phase: Math.random() * Math.PI * 2,
                    speed: CONFIG.weave.waveBaseSpeed * (0.8 + Math.random() * 0.4),
                    lifespan: maxLifespan,
                    age: 0,
                    fadeFrames: CONFIG.weave.fadeFrames,
                    alpha: 0,
                    points: points
                };
            }

            function resetStrand(str, colorIndex) {
                const m = CONFIG.weave.boundaryMargin;
                const edge = Math.floor(Math.random() * 4);
                let ox, oy;
                if (edge === 0) {
                    ox = -m - Math.random() * 140;
                    oy = -m + Math.random() * (height + m * 2);
                } else if (edge === 1) {
                    ox = width + m + Math.random() * 140;
                    oy = -m + Math.random() * (height + m * 2);
                } else if (edge === 2) {
                    ox = -m + Math.random() * (width + m * 2);
                    oy = -m - Math.random() * 140;
                } else {
                    ox = -m + Math.random() * (width + m * 2);
                    oy = height + m + Math.random() * 140;
                }

                const colorScheme = CONFIG.colors.strings[colorIndex % CONFIG.colors.strings.length];
                str.color = colorScheme.base;
                str.glowColor = colorScheme.glow;
                str.originX = ox;
                str.originY = oy;
                str.originDriftSeedX = Math.random() * 1000;
                str.originDriftSeedY = Math.random() * 1000;
                str.freq1 = 1.6 + Math.random() * 2.2;
                str.freq2 = 3.2 + Math.random() * 2.5;
                str.amp1 = 24 + Math.random() * 38;
                str.amp2 = 10 + Math.random() * 20;
                str.phase = Math.random() * Math.PI * 2;
                str.speed = CONFIG.weave.waveBaseSpeed * (0.8 + Math.random() * 0.4);
                str.lifespan = CONFIG.weave.lifespanMinFrames + Math.random() * (CONFIG.weave.lifespanMaxFrames - CONFIG.weave.lifespanMinFrames);
                str.age = 0;
                str.alpha = 0;

                for (let p = 0; p < str.points.length; p++) {
                    str.points[p].x = ox;
                    str.points[p].y = oy;
                }
            }

            function initStrands() {
                strings.length = 0;
                const count = CONFIG.weave.stringCount;
                for (let i = 0; i < count; i++) {
                    const strand = createStrandObject(i);
                    strand.age = (i / count) * strand.lifespan * 0.75;
                    strings.push(strand);
                }
            }

            function spawnSpark(x, y, tangentX, tangentY) {
                if (sparks.length >= CONFIG.weave.maxSparks) return;
                const angle = Math.atan2(tangentY, tangentX) + (Math.random() - 0.5) * 1.8;
                const speed = 0.2 + Math.random() * 0.6;
                const maxLife = CONFIG.weave.sparkLifeMin + Math.random() * (CONFIG.weave.sparkLifeMax - CONFIG.weave.sparkLifeMin);
                sparks.push({
                    x: x + (Math.random() - 0.5) * 8,
                    y: y + (Math.random() - 0.5) * 8,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: maxLife,
                    maxLife: maxLife,
                    size: 1.0 + Math.random() * 1.5,
                    color: CONFIG.colors.sparks[Math.floor(Math.random() * CONFIG.colors.sparks.length)]
                });
            }

            function updateFieldCoordinates(dt) {
                const cSpeed = CONFIG.weave.convergenceDriftSpeed * dt;
                convergencePoint.seedX += cSpeed;
                convergencePoint.seedY += cSpeed * 1.15;

                convergencePoint.x = width * (0.46 + 0.22 * Math.sin(convergencePoint.seedX) * Math.cos(convergencePoint.seedY * 0.65));
                convergencePoint.y = height * (0.48 + 0.22 * Math.cos(convergencePoint.seedY) * Math.sin(convergencePoint.seedX * 0.75));

                destinationPoint.angle += CONFIG.weave.destinationAngleSpeed * dt;
                const radius = Math.hypot(width, height) * 0.75 + CONFIG.weave.destExtraMargin;
                destinationPoint.x = width * 0.5 + Math.cos(destinationPoint.angle) * radius;
                destinationPoint.y = height * 0.5 + Math.sin(destinationPoint.angle) * radius;
            }

            function computeBraidSpine(u) {
                const dx = destinationPoint.x - convergencePoint.x;
                const dy = destinationPoint.y - convergencePoint.y;
                const len = Math.hypot(dx, dy) || 1;
                const nx = -dy / len;
                const ny = dx / len;
                const harmonicWave =
                    Math.sin(u * Math.PI) *
                    Math.sin(time * CONFIG.weave.harmonicArchSpeed + u * CONFIG.weave.harmonicArchHarmonics) *
                    CONFIG.weave.harmonicArchAmplitude;

                spineCache.x = convergencePoint.x + dx * u + nx * harmonicWave;
                spineCache.y = convergencePoint.y + dy * u + ny * harmonicWave;
                spineCache.nx = nx;
                spineCache.ny = ny;
                spineCache.tx = dx / len;
                spineCache.ty = dy / len;
                return spineCache;
            }

            function updateAndRenderStrings(dt) {
                const segs = CONFIG.weave.segmentCountHigh;
                const splitIndex = Math.floor(segs * 0.45);

                ctx.lineCap = "round";
                ctx.lineJoin = "round";

                for (let s = 0; s < strings.length; s++) {
                    const str = strings[s];
                    str.age += dt * 0.06;

                    if (str.age >= str.lifespan) {
                        resetStrand(str, s);
                    }

                    if (str.age < str.fadeFrames) {
                        str.alpha = str.age / str.fadeFrames;
                    } else if (str.age > str.lifespan - str.fadeFrames) {
                        str.alpha = Math.max(0, (str.lifespan - str.age) / str.fadeFrames);
                    } else {
                        str.alpha = 1;
                    }

                    if (str.alpha <= 0.005) continue;

                    str.originDriftSeedX += 0.0000015 * dt;
                    str.originDriftSeedY += 0.0000018 * dt;

                    const ox = str.originX + Math.sin(str.originDriftSeedX) * 35;
                    const oy = str.originY + Math.cos(str.originDriftSeedY) * 35;

                    const toConvX = convergencePoint.x - ox;
                    const toConvY = convergencePoint.y - oy;
                    const toConvLen = Math.hypot(toConvX, toConvY) || 1;
                    const pnx = -toConvY / toConvLen;
                    const pny = toConvX / toConvLen;

                    for (let i = 0; i < segs; i++) {
                        if (i <= splitIndex) {
                            const t = i / splitIndex;
                            const smoothT = t * t * (3 - 2 * t);
                            const baseX = ox + toConvX * smoothT;
                            const baseY = oy + toConvY * smoothT;
                            const envelope = Math.sin(t * Math.PI);
                            const wave =
                                Math.sin(t * str.freq1 * Math.PI - time * str.speed + str.phase) * str.amp1 +
                                Math.cos(t * str.freq2 * Math.PI + time * str.speed * 1.25 + str.phase) * str.amp2;

                            str.points[i].x = baseX + pnx * wave * envelope;
                            str.points[i].y = baseY + pny * wave * envelope;
                        } else {
                            const u = (i - splitIndex) / (segs - 1 - splitIndex);
                            const spine = computeBraidSpine(u);
                            const taper = Math.sin(Math.min(u * 3.1415, Math.PI * 0.88));
                            const braidAngle = u * Math.PI * 2 * (CONFIG.weave.braidFrequency * 8) - time * 0.000055 + str.phase;
                            const orbitOffset = Math.sin(braidAngle) * CONFIG.weave.braidRadius * (0.45 + 0.55 * taper);
                            const axialFlutter = Math.cos(braidAngle) * 2.5;

                            str.points[i].x = spine.x + spine.nx * orbitOffset + spine.tx * axialFlutter;
                            str.points[i].y = spine.y + spine.ny * orbitOffset + spine.ty * axialFlutter;
                        }
                    }

                    ctx.save();
                    ctx.globalAlpha = str.alpha;
                    ctx.globalCompositeOperation = "lighter";

                    ctx.strokeStyle = str.glowColor;
                    ctx.lineWidth = CONFIG.weave.lineWidthGlowFree;
                    ctx.beginPath();
                    ctx.moveTo(str.points[0].x, str.points[0].y);
                    for (let i = 1; i <= splitIndex; i++) {
                        const xc = (str.points[i - 1].x + str.points[i].x) * 0.5;
                        const yc = (str.points[i - 1].y + str.points[i].y) * 0.5;
                        ctx.quadraticCurveTo(str.points[i - 1].x, str.points[i - 1].y, xc, yc);
                    }
                    ctx.lineTo(str.points[splitIndex].x, str.points[splitIndex].y);
                    ctx.stroke();

                    ctx.lineWidth = CONFIG.weave.lineWidthGlowBraid;
                    ctx.beginPath();
                    ctx.moveTo(str.points[splitIndex].x, str.points[splitIndex].y);
                    for (let i = splitIndex + 1; i < segs; i++) {
                        const xc = (str.points[i - 1].x + str.points[i].x) * 0.5;
                        const yc = (str.points[i - 1].y + str.points[i].y) * 0.5;
                        ctx.quadraticCurveTo(str.points[i - 1].x, str.points[i - 1].y, xc, yc);
                    }
                    ctx.lineTo(str.points[segs - 1].x, str.points[segs - 1].y);
                    ctx.stroke();

                    ctx.strokeStyle = str.color;
                    ctx.lineWidth = CONFIG.weave.lineWidthFree * 1.6;
                    ctx.beginPath();
                    ctx.moveTo(str.points[0].x, str.points[0].y);
                    for (let i = 1; i <= splitIndex; i++) {
                        const xc = (str.points[i - 1].x + str.points[i].x) * 0.5;
                        const yc = (str.points[i - 1].y + str.points[i].y) * 0.5;
                        ctx.quadraticCurveTo(str.points[i - 1].x, str.points[i - 1].y, xc, yc);
                    }
                    ctx.lineTo(str.points[splitIndex].x, str.points[splitIndex].y);
                    ctx.stroke();

                    ctx.lineWidth = CONFIG.weave.lineWidthBraid * 1.4;
                    ctx.beginPath();
                    ctx.moveTo(str.points[splitIndex].x, str.points[splitIndex].y);
                    for (let i = splitIndex + 1; i < segs; i++) {
                        const xc = (str.points[i - 1].x + str.points[i].x) * 0.5;
                        const yc = (str.points[i - 1].y + str.points[i].y) * 0.5;
                        ctx.quadraticCurveTo(str.points[i - 1].x, str.points[i - 1].y, xc, yc);
                    }
                    ctx.lineTo(str.points[segs - 1].x, str.points[segs - 1].y);
                    ctx.stroke();

                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = CONFIG.weave.lineWidthFree;
                    ctx.beginPath();
                    ctx.moveTo(str.points[0].x, str.points[0].y);
                    for (let i = 1; i <= splitIndex; i++) {
                        const xc = (str.points[i - 1].x + str.points[i].x) * 0.5;
                        const yc = (str.points[i - 1].y + str.points[i].y) * 0.5;
                        ctx.quadraticCurveTo(str.points[i - 1].x, str.points[i - 1].y, xc, yc);
                    }
                    ctx.lineTo(str.points[splitIndex].x, str.points[splitIndex].y);
                    ctx.stroke();

                    ctx.lineWidth = CONFIG.weave.lineWidthBraid;
                    ctx.beginPath();
                    ctx.moveTo(str.points[splitIndex].x, str.points[splitIndex].y);
                    for (let i = splitIndex + 1; i < segs; i++) {
                        const xc = (str.points[i - 1].x + str.points[i].x) * 0.5;
                        const yc = (str.points[i - 1].y + str.points[i].y) * 0.5;
                        ctx.quadraticCurveTo(str.points[i - 1].x, str.points[i - 1].y, xc, yc);
                    }
                    ctx.lineTo(str.points[segs - 1].x, str.points[segs - 1].y);
                    ctx.stroke();

                    ctx.restore();
                }

                if (Math.random() < CONFIG.weave.sparkSpawnProbability) {
                    const u = 0.15 + Math.random() * 0.75;
                    const spine = computeBraidSpine(u);
                    spawnSpark(spine.x, spine.y, spine.tx, spine.ty);
                }
            }

            function updateAndRenderSparks() {
                ctx.save();
                ctx.globalCompositeOperation = "lighter";
                for (let i = sparks.length - 1; i >= 0; i--) {
                    const sp = sparks[i];
                    sp.x += sp.vx;
                    sp.y += sp.vy;
                    sp.vx *= 0.985;
                    sp.vy *= 0.985;
                    sp.life -= 1;

                    if (sp.life <= 0) {
                        sparks.splice(i, 1);
                        continue;
                    }

                    const alpha = Math.max(0, sp.life / sp.maxLife);
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = sp.color;
                    ctx.beginPath();
                    ctx.arc(sp.x, sp.y, sp.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function updateCustomCursor() {
                if (isTouchDevice || !pointer.hasMoved) return;

                cursorDot.style.transform = "translate3d(" + (pointer.x - 2.5) + "px, " + (pointer.y - 2.5) + "px, 0)";

                const prevDropX = pointer.dropX;
                const prevDropY = pointer.dropY;
                pointer.dropX += (pointer.x - pointer.dropX) * CONFIG.cursor.dropletLerp;
                pointer.dropY += (pointer.y - pointer.dropY) * CONFIG.cursor.dropletLerp;

                pointer.vx = pointer.dropX - prevDropX;
                pointer.vy = pointer.dropY - prevDropY;

                const speed = Math.hypot(pointer.vx, pointer.vy);
                if (speed > 0.4) {
                    pointer.angle = Math.atan2(pointer.vy, pointer.vx);
                }
                pointer.spin += CONFIG.cursor.rotationSpeed + speed * 0.003;

                const stretch = Math.min(speed * CONFIG.cursor.stretchFactor, CONFIG.cursor.maxStretch);
                const scaleX = 1 + stretch;
                const scaleY = Math.max(0.6, 1 - stretch * 0.45);

                cursorDroplet.style.transform =
                    "translate3d(" + (pointer.dropX - 22) + "px, " + (pointer.dropY - 22) + "px, 0) " +
                    "rotate(" + (pointer.angle + Math.sin(pointer.spin) * 0.18).toFixed(3) + "rad) " +
                    "scale(" + scaleX.toFixed(3) + ", " + scaleY.toFixed(3) + ")";

                for (let i = 0; i < interactiveButtons.length; i++) {
                    const btn = interactiveButtons[i];
                    const rect = btn.getBoundingClientRect();
                    const cx = rect.left + rect.width * 0.5;
                    const cy = rect.top + rect.height * 0.5;
                    const dx = pointer.x - cx;
                    const dy = pointer.y - cy;
                    const dist = Math.hypot(dx, dy);

                    const relX = ((pointer.x - rect.left) / Math.max(rect.width, 1)) * 100;
                    const relY = ((pointer.y - rect.top) / Math.max(rect.height, 1)) * 100;
                    btn.style.setProperty("--glare-x", relX.toFixed(1) + "%");
                    btn.style.setProperty("--glare-y", relY.toFixed(1) + "%");

                    if (dist < CONFIG.cursor.magneticDistance) {
                        const pull = (1 - dist / CONFIG.cursor.magneticDistance) * CONFIG.cursor.magneticForce;
                        btn.style.transform = "translate3d(" + (dx * pull).toFixed(2) + "px, " + (dy * pull).toFixed(2) + "px, 0)";
                    } else {
                        btn.style.transform = "translate3d(0, 0, 0)";
                    }
                }
            }

            function handlePointerCoord(e) {
                pointer.x = e.clientX;
                pointer.y = e.clientY;
                if (!pointer.hasMoved) {
                    pointer.hasMoved = true;
                    pointer.dropX = e.clientX;
                    pointer.dropY = e.clientY;
                }
            }

            function bindPointerEvents() {
                if (!isTouchDevice) {
                    window.addEventListener("pointermove", function (e) {
                        handlePointerCoord(e);
                    }, { passive: true });
                }

                window.addEventListener("contextmenu", function (e) {
                    e.preventDefault();
                    handlePointerCoord(e);
                    showContextMenu(e.clientX, e.clientY);
                    return false;
                }, { passive: false });

                window.addEventListener("click", function (e) {
                    if (!contextMenu.contains(e.target)) {
                        hideContextMenu();
                    }
                });
            }

            let lastFrameTime = performance.now();

            function animate(now) {
                if (systemTerminated || isAnimationPaused) return;
                const deltaMs = now - lastFrameTime;
                lastFrameTime = now;

                if (deltaMs > CONFIG.security.maxFrameFreezeMs && document.visibilityState === "visible") {
                    triggerSecurityCrash();
                    return;
                }

                const dt = Math.min(deltaMs, 40);
                time += dt;

                ctx.clearRect(0, 0, width, height);

                updateFieldCoordinates(dt);
                updateAndRenderStrings(dt);
                updateAndRenderSparks();
                updateCustomCursor();

                animFrameId = requestAnimationFrame(animate);
            }

            initSecurityGuards();
            resizeCanvas();
            window.addEventListener("resize", resizeCanvas);
            buildContextMenu();

            if (checkRouteIsValid()) {
                renderPortfolioUI();
            } else {
                render404Template();
            }

            initStrands();
            bindPointerEvents();
            animFrameId = requestAnimationFrame(animate);
        })();
    </script>
</body>
